name: 'Scade One Actions'

description: 'Run a Scade One actions workflow for model checking, code generation, and test execution.'

inputs:

  action:
    description: >
      action to execute.
    required: true

  scade-dir:
    description: >
      Ansys Scade One installation directory.
    required: true

  project:
    description: >
      Path of the Scade One project.
    required: true



on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  scadeone:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'  # Specify the Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scade One Actions
        run: |
          python scadeone_actions.py model_check -p path/to/project.sproj -j job_name -o path/to/output
          python scadeone_actions.py code_gen -p path/to/project.sproj -j job_name -o path/to/output
          python scadeone_actions.py tests_exec -p path/to/project.sproj -j job_name --junit path/to/junit_report.xml
