name: |
  'Scade One model check'

description: |
  'Run a Scade One actions workflow for model checking'

inputs:

  scade-dir:
    description: |
      "Scade One installation directory. This is the directory where the
      Scade One executable is located. It is used to run the Scade One actions."
    required: true
    type: string

  project:
    description: >
      Path of the SCADE Suite project.
    required: true
    type: string

  job-name:
    description: >
      Name of the job to run. This is used to identify the job in the Scade One
      actions workflow.
    required: true
    type: string

  # Optional inputs

  python-version:
    description: |
      Python version used for installing and execution of the build process.
    required: false
    default: '3.10'
    type: string

  use-python-cache:
    description: |
      Whether to use the Python cache for installing previously downloaded
      libraries. If ``true``, previously downloaded libraries are installed from the
      Python cache. If ``false``, libraries are downloaded from the PyPI index.
    required: false
    default: true
    type: boolean


runs:
  using: "composite"

  steps:
    - name: "Install Git and clone project"
      uses: actions/checkout@v2

    - name: "Set up Python"
      uses: ansys/actions/_setup-python@v10.0.14
      with:
        python-version: ${{ inputs.python-version }}
        use-cache: ${{ inputs.use-python-cache }}

    - name: "Install dependencies"
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: "Run Scade One Actions"
      shell: python
      run: |
        import sys
        # Add the src directory to the Python path so that the scadeone_actions module can
        # be imported.
        # The GITHUB_ACTION_PATH environment variable is set by GitHub Actions to the path of
        # the action being run.
        # It is used to ensure that the scadeone_actions module can be found.
        sys.path.insert(1, '${GITHUB_ACTION_PATH}/../src/')
        from scadeone_actions import scadeone_actions
        # Run the model check action with the provided inputs.
        scadeone_actions ['model_check', '-s', '${{ inputs.scade-dir }}', '-p', '${{ inputs.project }}', '-j', '${{ inputs.job-name }}', '-o', 'output/model_check_report.txt']
