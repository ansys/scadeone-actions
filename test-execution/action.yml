name: |
  Scade One tests execution

description: |
  The ``test-execution`` action executes tests on a Scade One project for a given job

inputs:

  scade-dir:
    description: |
      Scade One installation directory, e.g.
      ``'C:\Program Files\Ansys Inc\v261\Scade One'`` or ``'/opt/AnsysInc/v261/ScadeOne/'``.
    required: true
    type: string

  project:
    description: >
      Path of the Scade One project.
    required: true
    type: string

  job-name:
    description: >
      Name of the job to run. This is used to identify the job in the Scade One
      actions workflow.
    required: true
    type: string

  # Optional inputs

  test-execution-report:
    description: |
      Path to the model tests exec report file. If not provided, the report will be
      saved in the 'output' directory with the name ``'tests_exec_report.txt'``.
    required: false
    default: 'output/tests_exec_report.xml'
    type: string

  python-version:
    description: |
      Python version used for installation and execution of the build process.
    required: false
    default: '3.10'
    type: string

  use-python-cache:
    description: |
      Whether to use the Python cache to install previously downloaded
      libraries.
    required: false
    default: pip
    type: string

  fail-on-error:
    description: |
      Set action as failed if test report contains any failed test.
    required: false
    default: 'true'

  checkout:
    description: >
      Whether to clone the repository on the CI/CD machine.
    default: 'true'
    required: false

runs:
  using: "composite"

  # On Windows Git bash must be in the path of the runner.
  # A start-runner.bat script should add the path to the PATH environment variable
  # before to run the runner.

  steps:
    - name: "Install Git and clone project"
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      if: ${{ inputs.checkout == 'true' }}

    - name: "Set up Python"
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.use-python-cache }}

    - name: "Install dependencies"
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/requirements.txt -U --find-links "${{ inputs.scade-dir }}/resources/packages/pyscadeone"

    - name: "Run Scade One Actions"
      shell: python
      run: |
        import os
        import sys
        # Add the python-scripts directory to the Python path so that the scadeone_actions module can
        # be imported.
        # The GITHUB_ACTION_PATH environment variable is set by GitHub Actions to the path of
        # the action being run.
        # It is used to ensure that the scadeone_actions module can be found.
        python_scripts_path = os.path.abspath(os.path.join(os.environ["GITHUB_ACTION_PATH"], "..", "python-scripts"))
        sys.path.insert(1, python_scripts_path)
        from scadeone_actions import scadeone_actions
        # Run the Scade One action with the provided inputs.
        scadeone_actions(['test_execution', '-s', '${{ inputs.scade-dir }}', '-p', '${{ inputs.project }}', '-j', '${{ inputs.job-name }}', '--junit', '${{ inputs.test-execution-report }}'])

    - name: "Upload model tests exec report"
      uses: dorny/test-reporter@b082adf0eced0765477756c2a610396589b8c637 # v2.5.0
      if: (!cancelled())
      with:
        name: Tests exec report
        path: ${{ inputs.test-execution-report }}
        reporter: java-junit
        fail-on-error: ${{ inputs.fail-on-error }}
