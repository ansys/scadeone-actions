name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main

env:
  MAIN_PYTHON_VERSION: '3.10'
  DOCUMENTATION_CNAME: 'actions.scadeone.docs.pyansys.com'
  test-library-name: 'ansys-scadeone-actions'
  SCADE_ONE_DIR_WINDOWS: 'C:/Program Files/ANSYS Inc/v261/Scade One'
  SCADE_ONE_DIR_LINUX: '/opt/AnsysInc/v261/ScadeOne/'
  PROJECT: 'tests/QuadFlightControl/QuadFlightControl.sproj'
  JOB_MODEL_CHECK: "ModelCheckQuadFlightC"
  JOB_CODE_GEN: "CodeGen"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  labeler:
    name: "Label syncer"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: micnncim/action-label-syncer@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label based on changed files
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

      - uses: actions-ecosystem/action-add-labels@v1
        if: |
          startsWith(github.event.pull_request.head.ref, 'doc') ||
          startsWith(github.event.pull_request.head.ref, 'docs')
        with:
          labels: documentation

      - uses: actions-ecosystem/action-add-labels@v1
        if: |
          startsWith(github.event.pull_request.head.ref, 'maint') ||
          startsWith(github.event.pull_request.head.ref, 'no-ci') ||
          startsWith(github.event.pull_request.head.ref, 'ci')
        with:
          labels: maintenance

      - uses: actions-ecosystem/action-add-labels@v1
        if: startsWith(github.event.pull_request.head.ref, 'feat')
        with:
          labels: |
            enhancement

      - uses: actions-ecosystem/action-add-labels@v1
        if: |
          startsWith(github.event.pull_request.head.ref, 'fix') ||
          startsWith(github.event.pull_request.head.ref, 'patch')
        with:
          labels: bug

      - name: Suggest to add labels
        uses: peter-evans/create-or-update-comment@v4
        if: toJSON(github.event.pull_request.labels.*.name) == '{}'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Please add one of the following labels to add this contribution to the Release Notes :point_down:
            - [bug](https://github.com/ansys/scadeone-actions/pulls?q=label%3Abug+)
            - [documentation](https://github.com/ansys/scadeone-actions/pulls?q=label%3Adocumentation+)
            - [enhancement](https://github.com/ansys/scadeone-actions/pulls?q=label%3Aenhancement+)
            - [good first issue](https://github.com/ansys/scadeone-actions/pulls?q=label%3Agood+first+issue)
            - [maintenance](https://github.com/ansys/scadeone-actions/pulls?q=label%3Amaintenance+)
            - [release](https://github.com/ansys/scadeone-actions/pulls?q=label%3Arelease+)

  pr-style:
    name: "PR style"
    runs-on: ubuntu-latest
    needs: labeler
    steps:
      - name: "Check pr title"
        uses: ansys/actions/check-pr-title@v10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  code-style:
    name: "Code style"
    runs-on: ubuntu-latest
    needs: pr-style
    steps:
      - name: "Run code style checks"
        uses: ansys/actions/code-style@v10
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          use-python-cache: false

      - name: "Verify private actions are not pointing to the 'main' branch"
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
        run: |
          if $(grep -q --exclude-dir={.git,.github,doc} "ansys\/actions\/.*\@main" -r .); then
            echo -e "\033[1;91m[ERROR]: Found private actions pointing to the 'main' branch.\033[0m"
            grep -q --exclude-dir={.git,.github,doc} "ansys\/actions\/.*\@main" -r .
          fi

  doc-style:
    name: "Doc style"
    runs-on: ubuntu-latest
    needs: pr-style
    steps:
      - name: "Run documentation style checks"
        uses: ansys/actions/doc-style@v10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  doc-build:
    name: "Doc build"
    runs-on: ubuntu-latest
    needs: doc-style
    steps:
      - name: "Build documentation"
        uses: ansys/actions/doc-build@v10
        with:
          skip-install: true
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          use-python-cache: false
          dependencies: qpdf



  setup:
    runs-on: [self-hosted, 'ScadeOne']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

  model_check:
    runs-on: [self-hosted, 'ScadeOne']
    needs: setup
    steps:
      - name: Set SCADE_ONE_DIR based on OS
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "SCADE_ONE_DIR=${{ env.SCADE_ONE_DIR_WINDOWS }}" >> $GITHUB_ENV
          else
            echo "SCADE_ONE_DIR=${{ env.SCADE_ONE_DIR_LINUX }}" >> $GITHUB_ENV
          fi
      - name: Run model check action
        uses: ./model_check
        with:
          scade-dir: ${{ env.SCADE_ONE_DIR }}
          project: ${{ env.PROJECT }}
          job-name: ${{ env.JOB_MODEL_CHECK }}
          python-version: '3.11'


  tests_exec:
    runs-on: [self-hosted, 'ScadeOne']
    needs: model_check
    strategy:
      matrix:
        # Define the list of jobs to run for model tests execution
        job-tests: ['TestExeVerticalAccel', 'QuadTest', 'TestExeRightRoll']
    steps:
      - name: Set SCADE_ONE_DIR based on OS
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "SCADE_ONE_DIR=${{ env.SCADE_ONE_DIR_WINDOWS }}" >> $GITHUB_ENV
          else
            echo "SCADE_ONE_DIR=${{ env.SCADE_ONE_DIR_LINUX }}" >> $GITHUB_ENV
            echo "LD_LIBRARY_PATH=${{ env.SCADE_ONE_DIR_LINUX }}/tools/simulator:${{ env.SCADE_ONE_DIR_LINUX }}/tools/simulator/runtimes/linux-x64:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          fi
      - name: Run model tests execution
        uses: ./tests_exec
        with:
          scade-dir: ${{ env.SCADE_ONE_DIR }}
          project: ${{ env.PROJECT }}
          job-name: ${{ matrix.job-tests }}
          python-version: '3.11'

  code_gen:
    runs-on: [self-hosted, 'ScadeOne']
    needs: tests_exec
    steps:
      - name: Set SCADE_ONE_DIR based on OS
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "SCADE_ONE_DIR=${{ env.SCADE_ONE_DIR_WINDOWS }}" >> $GITHUB_ENV
          else
            echo "SCADE_ONE_DIR=${{ env.SCADE_ONE_DIR_LINUX }}" >> $GITHUB_ENV
          fi
      - name: Run model code generation
        uses: ./code_gen
        with:
          scade-dir: ${{ env.SCADE_ONE_DIR }}
          project: ${{ env.PROJECT }}
          job-name: ${{ env.JOB_CODE_GEN }}
          python-version: '3.11'


  tests:
    name: "All Tests"
    needs: [code_gen]
    runs-on: ubuntu-latest
    steps:
      - name: "Synchronization"
        run: |
          echo Tests completed

  doc-deploy-dev:
    name: "Deploy developers documentation"
    needs: [doc-build, tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(github.ref, 'refs/tags')
    steps:
      - uses: ansys/actions/doc-deploy-dev@v10
        with:
            cname: ${{ env.DOCUMENTATION_CNAME }}
            token: ${{ secrets.GITHUB_TOKEN }}
            bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
            bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  release:
    name: "Release to GitHub"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [doc-build, tests]
    steps:

    - name: "Download HTML documentation"
      uses: actions/download-artifact@v5
      with:
        name: documentation-html
        path: documentation-html

    - name: "Zip HTML documentation"
      uses: vimtor/action-zip@v1.2
      with:
        files: documentation-html
        dest: documentation-html.zip

    - name: "Download PDF documentation"
      uses: actions/download-artifact@v5
      with:
        name: documentation-pdf
        path: documentation-pdf

    - name: "Zip PDF documentation"
      uses: vimtor/action-zip@v1.2
      with:
        files: documentation-pdf
        dest: documentation-pdf.zip

    - name: "Display the structure of downloaded files"
      shell: bash
      run: ls -R

    - name: "Release to GitHub"
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          documentation-html.zip
          documentation-pdf.zip

  doc-deploy-stable:
    name: "Upload stable documentation"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: ansys/actions/doc-deploy-stable@v10
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
