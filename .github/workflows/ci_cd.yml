name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main

permissions:
  contents: read

env:
  MAIN_PYTHON_VERSION: '3.13'
  DOCUMENTATION_CNAME: 'actions.scadeone.docs.pyansys.com'
  test-library-name: 'ansys-scadeone-actions'
  SCADE_ONE_DIR_WINDOWS: 'C:/Program Files/ANSYS Inc/v261/Scade One/'
  SCADE_ONE_DIR_LINUX: '/opt/AnsysInc/v261/ScadeOne/'
  PROJECT: 'tests/resources/QuadFlightControl/QuadFlightControl.sproj'
  JOB_MODEL_CHECK: "ModelCheckQuadFlightC"
  JOB_CODE_GEN: "CodeGen"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  check-actions-security:
    name: "Check GitHub Actions security"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/check-actions-security@7e7af221736bc4d9fb84a2ab28f99518e9bca84c # v11.0.5

  labeler:
    name: "Label syncer"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required for labeling pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c # v1.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label based on changed files
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

      - uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # v1.1.3
        if: |
          startsWith(github.event.pull_request.head.ref, 'doc') ||
          startsWith(github.event.pull_request.head.ref, 'docs')
        with:
          labels: documentation

      - uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # v1.1.3
        if: |
          startsWith(github.event.pull_request.head.ref, 'maint') ||
          startsWith(github.event.pull_request.head.ref, 'no-ci') ||
          startsWith(github.event.pull_request.head.ref, 'ci')
        with:
          labels: maintenance

      - uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # v1.1.3
        if: startsWith(github.event.pull_request.head.ref, 'feat')
        with:
          labels: |
            enhancement

      - uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # v1.1.3
        if: |
          startsWith(github.event.pull_request.head.ref, 'fix') ||
          startsWith(github.event.pull_request.head.ref, 'patch')
        with:
          labels: bug

      - name: Suggest to add labels
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: toJSON(github.event.pull_request.labels.*.name) == '{}'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Please add one of the following labels to add this contribution to the Release Notes :point_down:
            - [bug](https://github.com/ansys/scadeone-actions/pulls?q=label%3Abug+)
            - [documentation](https://github.com/ansys/scadeone-actions/pulls?q=label%3Adocumentation+)
            - [enhancement](https://github.com/ansys/scadeone-actions/pulls?q=label%3Aenhancement+)
            - [good first issue](https://github.com/ansys/scadeone-actions/pulls?q=label%3Agood+first+issue)
            - [maintenance](https://github.com/ansys/scadeone-actions/pulls?q=label%3Amaintenance+)
            - [release](https://github.com/ansys/scadeone-actions/pulls?q=label%3Arelease+)

  pr-style:
    name: "PR style"
    runs-on: ubuntu-latest
    needs: labeler
    permissions:
      contents: read
      pull-requests: read # Required for reading pull request info
    steps:
      - name: "Check pr title"
        uses: ansys/actions/check-pr-title@7e7af221736bc4d9fb84a2ab28f99518e9bca84c # v11.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  code-style:
    name: "Code style"
    runs-on: ubuntu-latest
    needs: pr-style
    steps:
      - name: "Run code style checks"
        uses: ansys/actions/code-style@7e7af221736bc4d9fb84a2ab28f99518e9bca84c # v11.0.5
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          use-python-cache: false

      - name: "Verify private actions are not pointing to the 'main' branch"
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
        run: |
          if $(grep -q --exclude-dir={.git,.github,doc} "ansys\/actions\/.*\@main" -r .); then
            echo -e "\033[1;91m[ERROR]: Found private actions pointing to the 'main' branch.\033[0m"
            grep -q --exclude-dir={.git,.github,doc} "ansys\/actions\/.*\@main" -r .
          fi

  doc-style:
    name: "Doc style"
    runs-on: ubuntu-latest
    needs: pr-style
    steps:
      - name: "Run documentation style checks"
        uses: ansys/actions/doc-style@7e7af221736bc4d9fb84a2ab28f99518e9bca84c # v11.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  doc-build:
    name: "Doc build"
    runs-on: ubuntu-latest
    needs: doc-style
    steps:
      - name: "Build documentation"
        uses: ansys/actions/doc-build@7e7af221736bc4d9fb84a2ab28f99518e9bca84c # v11.0.5
        with:
          skip-install: true
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          use-python-cache: false
          dependencies: qpdf
          sphinxopts: "-j auto -W --keep-going -v"

  test-fail:
   name: "Test Execution with errors"
   runs-on: [self-hosted, 'ScadeOne']
   strategy:
     matrix:
       os: [ubuntu-latest, windows-latest]
   steps:
    - name: "Install Git and clone project"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run model check action
      uses: ./test-execution
      with:
          scade-dir: ${{ runner.os == 'Windows' && env.SCADE_ONE_DIR_WINDOWS || env.SCADE_ONE_DIR_LINUX }}
          project: 'tests/resources/Project/Project.sproj'
          job-name: 'myTestJob'
          fail-on-error: 'false'
          checkout: 'false'
          python-version: ${{ env.MAIN_PYTHON_VERSION }}


  model-check:
    name: "Model Check"
    runs-on: [self-hosted, 'ScadeOne']
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: "Install Git and clone project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run model check action
        uses: ./model-check
        with:
            scade-dir: ${{ runner.os == 'Windows' && env.SCADE_ONE_DIR_WINDOWS || env.SCADE_ONE_DIR_LINUX }}
            project: ${{ env.PROJECT }}
            job-name: ${{ env.JOB_MODEL_CHECK }}
            artifact-name: 'model-check-artifact-${{ matrix.os }}'
            checkout: 'false'
            python-version: ${{ env.MAIN_PYTHON_VERSION }}



  test-execution:
    name: "Test Execution"
    runs-on: [self-hosted, 'ScadeOne']
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Define the list of jobs to run for model tests execution
        job-tests: ['TestExeVerticalAccel', 'QuadTest', 'TestExeRightRoll']
    steps:
      - name: "Install Git and clone project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run model tests execution
        uses: ./test-execution
        with:
          scade-dir: ${{ runner.os == 'Windows' && env.SCADE_ONE_DIR_WINDOWS || env.SCADE_ONE_DIR_LINUX }}
          project: ${{ env.PROJECT }}
          job-name: ${{ matrix.job-tests }}
          checkout: 'false'
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  code-generation:
    name: "Code Generation"
    runs-on: [self-hosted, 'ScadeOne']
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: "Install Git and clone project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run model code generation
        uses: ./code-generation
        with:
          scade-dir: ${{ runner.os == 'Windows' && env.SCADE_ONE_DIR_WINDOWS || env.SCADE_ONE_DIR_LINUX }}
          project: ${{ env.PROJECT }}
          job-name: ${{ env.JOB_CODE_GEN }}
          artifact-name: 'code-generation-artifact-${{ matrix.os }}'
          checkout: 'false'
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  fmu-export:
    name: "FMU Export"
    runs-on: [self-hosted, 'ScadeOne', 'Windows']
    steps:
      - name: "Install Git and clone project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run FMU export
        uses: ./fmu-export
        with:
          scade-dir: ${{ env.SCADE_ONE_DIR_WINDOWS  }}
          project: 'tests/resources/Project/Project.sproj'
          job-name: 'CodeGenerationJob'
          kind: 'ME'
          checkout: 'false'
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  simulation:
    name: "Simulation"
    runs-on: [self-hosted, 'ScadeOne']
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
        - name: "Install Git and clone project"
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
        - name: Run simulation action
          uses: ./simulation
          with:
            scade-dir: ${{ runner.os == 'Windows' && env.SCADE_ONE_DIR_WINDOWS || env.SCADE_ONE_DIR_LINUX }}
            project: ${{ env.PROJECT }}
            job-name: 'SimVerticalAccel'
            artifact-name: 'simulation-artifact-${{ matrix.os }}'
            checkout: 'false'
            python-version: ${{ env.MAIN_PYTHON_VERSION }}

  unit-tests:
    name: "Run Python unit tests"
    runs-on: [self-hosted, 'ScadeOne']
    steps:
      - name: "Install Git and clone project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: "Install dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip tox

      - name: "Executing test suite"
        shell: bash
        run: |
          tox -e tests

  tests:
    name: "All Tests"
    needs: [test-fail, model-check, code-generation, test-execution, fmu-export, simulation, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read # Minimal permissions needed
    steps:
      - name: "Synchronization"
        run: |
          echo Tests completed

  doc-deploy-dev:
    name: "Deploy developers documentation"
    needs: [doc-build, tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(github.ref, 'refs/tags')
    permissions:
      contents: write # Required for deploying documentation
    steps:
      - uses: ansys/actions/doc-deploy-dev@7e7af221736bc4d9fb84a2ab28f99518e9bca84c # v11.0.5
        with:
            cname: ${{ env.DOCUMENTATION_CNAME }}
            token: ${{ secrets.GITHUB_TOKEN }}
            bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
            bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  release:
    name: "Release to GitHub"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [doc-build, tests]
    permissions:
      contents: write # Required for creating GitHub releases
    steps:

    - name: "Download HTML documentation"
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: documentation-html
        path: documentation-html

    - name: "Zip HTML documentation"
      uses: vimtor/action-zip@5407800dfb2b1b37d48df912330cb22f4ab6f422 # v1.3
      with:
        files: documentation-html
        dest: documentation-html.zip

    - name: "Download PDF documentation"
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: documentation-pdf
        path: documentation-pdf

    - name: "Zip PDF documentation"
      uses: vimtor/action-zip@5407800dfb2b1b37d48df912330cb22f4ab6f422 # v1.3
      with:
        files: documentation-pdf
        dest: documentation-pdf.zip

    - name: "Display the structure of downloaded files"
      shell: bash
      run: ls -R

    - name: "Release to GitHub"
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        generate_release_notes: true
        files: |
          documentation-html.zip
          documentation-pdf.zip

  doc-deploy-stable:
    name: "Upload stable documentation"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write # Required for deploying documentation
    steps:
      - uses: ansys/actions/doc-deploy-stable@7e7af221736bc4d9fb84a2ab28f99518e9bca84c # v11.0.5
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
