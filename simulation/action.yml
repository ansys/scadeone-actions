name: |
  Scade One simulation

description: |
  The ``simulation`` action simulates a Scade One project for a given job.

inputs:

  scade-dir:
    description: |
      Scade One installation directory, e.g.
      ``'C:\Program Files\Ansys Inc\v261\Scade One'`` or ``'/opt/AnsysInc/v261/ScadeOne/'``.
    required: true
    type: string

  project:
    description: >
      Path of the Scade One project.
    required: true
    type: string

  job-name:
    description: >
      Name of the job to run. This is used to identify the job in the Scade One
      actions workflow.
    required: true
    type: string

  # Optional inputs

  target-dir:
    description: |
      Path to the results of the simulation and logs. If not provided, they will be
      saved in the ``'output/simu_results'`` directory.
    required: false
    default: 'output/simu_results'
    type: string

  artifact-name:
    description: |
      Name of the artifact to upload.
    required: false
    default: 'Simulation Results'
    type: string

  python-version:
    description: |
      Python version used for installation and execution of the build process.
    required: false
    default: '3.10'
    type: string

  use-python-cache:
    description: |
      Whether to use the Python cache to install previously downloaded
      libraries.
    required: false
    default: pip
    type: string

  checkout:
    description: |
      Whether to clone the repository on the CI/CD machine.
    default: 'true'
    required: false

runs:
  using: "composite"

  # On Windows Git bash must be in the path of the runner.
  # A start-runner.bat script should add the path to the PATH environment variable
  # before to run the runner.

  steps:
    - name: "Install Git and clone project"
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      if: ${{ inputs.checkout == 'true' }}
      with:
        persist-credentials: false

    - name: "Set up Python"
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.use-python-cache }}

    - name: "Install dependencies"
      shell: bash
      env:
        SCADE_DIR: ${{ inputs.scade-dir }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/requirements.txt -U --find-links "${SCADE_DIR}/resources/packages/pyscadeone"

    - name: "Run Scade One Actions"
      shell: python
      env:
        SCADE_DIR: ${{ inputs.scade-dir }}
        PROJECT: ${{ inputs.project }}
        JOB_NAME: ${{ inputs.job-name }}
        TARGET_DIR: ${{ inputs.target-dir }}
      run: |
        import os
        import sys
        # Add the python-scripts directory to the Python path so that the scadeone_actions module can
        # be imported.
        # The GITHUB_ACTION_PATH environment variable is set by GitHub Actions to the path of
        # the action being run.
        # It is used to ensure that the scadeone_actions module can be found.
        python_scripts_path = os.path.abspath(os.path.join(os.environ["GITHUB_ACTION_PATH"], "..", "python-scripts"))
        sys.path.insert(1, python_scripts_path)
        from scadeone_actions import scadeone_actions
        # Run the Scade One action with the provided inputs.
        scadeone_actions(['simulation', '-s', os.environ['SCADE_DIR'], '-p', os.environ['PROJECT'], '-j', os.environ['JOB_NAME'], '-o', os.environ['TARGET_DIR']])

    - name: "Upload generated code report"
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{inputs.artifact-name }}
        path: ${{ inputs.target-dir }}
        if-no-files-found: error
        retention-days: 7
